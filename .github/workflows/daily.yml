name: 每日盘后数据更新

on:
  schedule:
    # 北京时间 15:30 = UTC 07:30，仅工作日（周一至周五）
    # 注意：A股节假日仍会触发，但脚本拉到的是最近交易日数据，无影响
    - cron: "30 7 * * 1-5"

  # 支持手动触发（用于测试或补跑）
  workflow_dispatch:

jobs:
  update-data:
    name: 拉取数据并更新 data.json
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write   # 允许 push

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install akshare pandas

      - name: 运行数据拉取脚本
        run: python fetch_data.py

      - name: 提交并推送 data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # 只有内容有变化才 commit，避免空提交
          git diff --staged --quiet || git commit -m "📊 每日数据更新 $(date +'%Y-%m-%d %H:%M UTC')"
          git push
